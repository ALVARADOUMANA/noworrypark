name: Release

on:
  workflow_dispatch:
    inputs:
      date:
        description: "Target date to reserve (YYYY-MM-DD). Leave empty to run right now with the default +7 days calculation."
        required: false
        type: string

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Call the Worker
        run: |
          BASE="${{ secrets.NOWORRYPARK_URL }}"
          KEY="${{ secrets.MANUAL_TRIGGER_KEY }}"
          DATE="${{ inputs.date }}"
          if [ -n "$DATE" ]; then
            # Con fecha: la agenda, no reserva ahora. El Worker se dispara solo
            # 7 días antes, a las 5:56am CR.
            curl -sS -f "${BASE}/schedule?key=${KEY}&date=${DATE}"
          else
            # Sin fecha: corre ya mismo con el cálculo por defecto (hoy + 7 días).
            curl -sS -f "${BASE}/trigger?key=${KEY}"
          fi