name = "noworrypark"
main = "src/index.ts"
compatibility_date = "2026-08-01"

# Logs gratis del plan Free (200k eventos/día, retención 3 días) — visibles en
# Workers & Pages → noworrypark → Observability, además de `wrangler tail` en vivo.
[observability]
enabled = true

# Cron 1: lunes y miércoles a las 11:51 UTC = 5:51am CR — reserva automática de rutina.
# Cron 2: TODOS los días a las 11:51 UTC — solo revisa si hay una fecha puntual agendada
# (vía /schedule) que caiga justo hoy + PARSO_DAYS_AHEAD; si no hay ninguna, no hace nada.
# OJO: Cloudflare numera los días 1=domingo...7=sábado (distinto al cron estándar donde
# 0=domingo). Por eso usamos nombres (MON, WED) y no números, para evitar ese lío.
[triggers]
crons = ["51 11 * * MON,WED", "51 11 * * *"]

# KV donde se guardan las fechas puntuales agendadas con /schedule (fecha -> pendiente).
# Creala una vez con: npx wrangler kv namespace create PENDING_DATES
# y pegá el "id" que te da abajo.
[[kv_namespaces]]
binding = "PENDING_DATES"
id = "ac9647bfd0684af9abc5c919bcf7177c"

# --- Parámetros NO sensibles (van al repo tal cual) ---
[vars]
PARSO_BASE_URL = "https://baclatam.corporateparking.parso.cr"
PARSO_PLATE = "BMM993"
PARSO_REASON = "Jornada Laboral"
PARSO_ENTRY_TIME = "07:30"
# IDs de parqueo en orden de preferencia (primero Plaza Roble, si falla RCC Roble)
PARSO_LOT_PRIORITY = "1,80"
# Nombres legibles para esos IDs, usados en las notificaciones (id:nombre, separados por coma)
PARSO_LOT_NAMES = "1:Plaza Roble,80:RCC Roble"
# Cuántos días adelante cae el día que se habilita hoy
PARSO_DAYS_AHEAD = "7"
# Después de que un lote es aceptado por la API, cuántas veces (y cada cuántos
# segundos) se revisa si ya quedó confirmado antes de darlo por "pendiente".
# 6 x 5s = ~30 segundos de paciencia antes de reportar como pendiente.
PARSO_CONFIRM_POLL_ATTEMPTS = "6"
PARSO_CONFIRM_POLL_DELAY_SECONDS = "5"

# --- Secretos (NUNCA van aquí ni al repo) ---
# Se configuran una sola vez con:
#   npx wrangler secret put PARSO_EMAIL
#   npx wrangler secret put PARSO_PASSWORD
#   npx wrangler secret put TELEGRAM_BOT_TOKEN
#   npx wrangler secret put TELEGRAM_CHAT_ID
#   npx wrangler secret put MANUAL_TRIGGER_KEY   (una clave inventada por vos, para pruebas manuales)